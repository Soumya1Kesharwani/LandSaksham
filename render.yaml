# ==============================================================================
# Render Blueprint Specification for LandSaksham (NLIIS)
# https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  # ============================================================================
  # OPTION 1 (DEFAULT / RECOMMENDED): Unified Full-Stack Service (Docker)
  # - Only consumes 1 Render Free Tier service
  # - Multi-stage build handles React/Vite compilation + FastAPI execution
  # - Zero CORS configuration required; direct SPA & API routing
  # ============================================================================
  - type: web
    name: landsaksham
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000

